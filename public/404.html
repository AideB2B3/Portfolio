<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Davide Bellobuono - iOS Developer</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages serves this file for any URL that doesn't match a
      // real static asset (e.g. a direct visit to /Portfolio/cowpow-radio).
      // It re-encodes the path into a query string and redirects to the
      // real index.html, where the decoder script below restores it so
      // React Router can pick up the correct route on load.
      var pathSegmentsToKeep = 1; // keep "/Portfolio"

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
